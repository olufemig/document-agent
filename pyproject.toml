[project]
name = "document-agent"
version = "0.1.0"
description = "Agentic document generation with Google ADK and local case study retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-adk>=2.7.1",
    "google-genai>=2.20.0",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-gemini>=0.4.2",
    "llama-index-vector-stores-chroma>=0.5.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]
